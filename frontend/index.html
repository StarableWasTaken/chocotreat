<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHOCOTREAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Τα χρώματα και οι χρόνοι της κίνησης, μαζεμένα σε ένα σημείο για να αλλάζουν εύκολα */
  :root {
    --salmon: #ff5a5a;
    --green: #1fa51f;
    --white: #ffffff;
    --drop: calc(50dvh - 75px);   /* πόσο χαμηλά ξεκινάει ο τίτλος (στο κέντρο της οθόνης) */
    --start-scale: 1.9;          /* πόσο μεγάλος ξεκινάει ο τίτλος */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: "Syne", "Arial Black", "Segoe UI", sans-serif;
    font-weight: 800;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* Ο τίτλος: εμφανίζεται στο κέντρο, μένει λίγο, και μετά ανεβαίνει πάνω μικραίνοντας */
  .hero { text-align: center; padding: 28px 16px 22px; }
  .hero h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4vw, 2.6rem);
    line-height: 1.15;
    letter-spacing: 1px;
    animation: intro 3.4s cubic-bezier(.65, 0, .35, 1) both;
  }
  @keyframes intro {
    0%   { opacity: 0; transform: translateY(var(--drop)) scale(var(--start-scale)); }
    35%  { opacity: 1; transform: translateY(var(--drop)) scale(var(--start-scale)); }
    58%  { opacity: 1; transform: translateY(var(--drop)) scale(var(--start-scale)); }
    100% { opacity: 1; transform: none; }
  }

  /* Οι τρεις επιλογές: η πρώτη μόνη της, οι άλλες δύο μαζί στα δεξιά */
  .cards {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 22px;
    padding: 0 4vw 4vw;
  }
  .soon { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

  /* Κάθε κάρτα: το σχήμα της ζωγραφίζεται από το script, εδώ μπαίνει το περιεχόμενο */
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 62dvh;
    padding: 34px 26px 36px;
    text-align: center;
    color: #fff;
    text-decoration: none;
    opacity: var(--o, 1);
    animation: fadeIn 1s ease both;
  }
  .card svg.shape { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .card > *:not(svg.shape) { position: relative; z-index: 1; }

  /* Οι κάρτες εμφανίζονται η μία μετά την άλλη, αφού ανέβει ο τίτλος */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: var(--o, 1); } }
  .card.xmas { animation-delay: 3.0s; }
  .card.love { animation-delay: 3.3s; }
  .card.easter { animation-delay: 3.6s; }

  /* Η κάρτα των Χριστουγέννων είναι η μόνη που ανοίγει */
  .card.xmas { cursor: pointer; transition: transform .2s ease; }
  .card.xmas:hover, .card.xmas:focus-visible { transform: translateY(-6px) rotate(-.6deg); outline: none; }

  /* Οι κάρτες που έρχονται σύντομα είναι θαμπές και δεν πατιούνται */
  .card.love, .card.easter { --o: .55; cursor: not-allowed; }

  .art { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; padding-bottom: 18px; }
  .art svg { width: min(52%, 190px); height: auto; overflow: visible; }
  /* Στις θαμπές κάρτες η εικόνα μένει ψηλά, ώστε το κείμενο "Έρχονται σύντομα" να μπαίνει στη μέση */
  .love .art, .easter .art { align-items: flex-start; }

  .label { font-size: clamp(1.7rem, 3.6vw, 2.9rem); line-height: 1.12; letter-spacing: 1px; }
  .love .label { color: #3a1a66; font-size: clamp(1.1rem, 2.2vw, 1.9rem); }
  .love .label b { display: block; font-size: 1.5em; }
  .easter .label { color: #3f8f86; }

  /* Το κείμενο "Έρχονται σύντομα" πάνω από τις δύο θαμπές κάρτες */
  .soon-text {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    font-size: clamp(1.7rem, 4.2vw, 3.6rem);
    line-height: 1.15;
    letter-spacing: 2px;
    color: #d6d6d6;
    animation: fadeIn 1s ease both;
    animation-delay: 3.9s;
  }

  @media (max-width: 800px) {
    :root { --drop: calc(50dvh - 58px); --start-scale: 1.35; }
    .cards { grid-template-columns: 1fr; }
    .soon { grid-template-columns: 1fr; }
    .card { min-height: 300px; }
  }

  /* Για όσους έχουν κλείσει τις κινήσεις στη συσκευή τους, όλα φαίνονται αμέσως */
  @media (prefers-reduced-motion: reduce) {
    .hero h1, .card, .soon-text { animation: none; }
  }
</style>
</head>
<body>

<header class="hero">
  <h1>Καλωσορίσατε στο<br>CHOCOTREAT</h1>
</header>

<main class="cards">

  <!-- Χριστούγεννα: ανοίγει τη σελίδα που έχουμε ήδη φτιάξει -->
  <a class="card xmas" href="christmas.html" data-top="#d40000" data-bottom="#a30000" data-edge="#d9d9d9" aria-label="Χριστούγεννα">
    <svg class="shape" aria-hidden="true"></svg>
    <div class="art">
      <svg viewBox="0 0 120 150" aria-hidden="true">
        <polygon points="60,12 95,62 25,62" fill="#1a8f2a" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
        <polygon points="60,40 105,98 15,98" fill="#1a8f2a" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
        <polygon points="60,70 114,132 6,132" fill="#1a8f2a" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
        <rect x="50" y="132" width="20" height="16" fill="#7a4a1e" stroke="#000" stroke-width="4"/>
        <polygon points="60,0 64,9 74,9 66,15 69,24 60,18 51,24 54,15 46,9 56,9" fill="#ffd23f" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="52" cy="58" r="5" fill="#ff4d4d" stroke="#000" stroke-width="2.5"/>
        <circle cx="72" cy="88" r="5" fill="#ffd23f" stroke="#000" stroke-width="2.5"/>
        <circle cx="42" cy="112" r="5" fill="#ff4d4d" stroke="#000" stroke-width="2.5"/>
        <circle cx="82" cy="118" r="5" fill="#fff" stroke="#000" stroke-width="2.5"/>
      </svg>
    </div>
    <!-- Τα γράμματα παίρνουν εναλλάξ χρώμα από το script -->
    <div class="label rainbow" aria-hidden="true">ΧΡΙΣΤΟΥ<br>ΓΕΝΝΑ!</div>
  </a>

  <div class="soon">
    <!-- Του Αγίου Βαλεντίνου: έρχεται σύντομα, δεν πατιέται -->
    <div class="card love" data-top="#8a3d94" data-bottom="#6e2f7a" data-edge="#5b2b78" aria-disabled="true">
      <svg class="shape" aria-hidden="true"></svg>
      <div class="art">
        <svg viewBox="0 0 120 110" aria-hidden="true">
          <path d="M60 104 C20 70 6 48 6 30 C6 14 18 4 32 4 C44 4 54 10 60 22 C66 10 76 4 88 4 C102 4 114 14 114 30 C114 48 100 70 60 104 Z" fill="#ff5c8a" stroke="#2a0a30" stroke-width="5" stroke-linejoin="round"/>
          <path d="M28 24 C32 18 40 16 44 20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label"><b>14</b>ΦΕΒΡΟΥΑΡΙΟΥ</div>
    </div>

    <!-- Πάσχα: έρχεται σύντομα, δεν πατιέται -->
    <div class="card easter" data-top="#7a5a46" data-bottom="#6a4c3a" data-edge="#8a5a30" aria-disabled="true">
      <svg class="shape" aria-hidden="true"></svg>
      <div class="art">
        <svg viewBox="0 0 100 130" aria-hidden="true">
          <defs><clipPath id="egg"><path d="M50 6 C78 6 94 56 94 84 C94 112 74 126 50 126 C26 126 6 112 6 84 C6 56 22 6 50 6 Z"/></clipPath></defs>
          <path d="M50 6 C78 6 94 56 94 84 C94 112 74 126 50 126 C26 126 6 112 6 84 C6 56 22 6 50 6 Z" fill="#f2d36b"/>
          <g clip-path="url(#egg)">
            <polyline points="0,70 12,58 25,70 38,58 50,70 62,58 75,70 88,58 100,70" fill="none" stroke="#d9534f" stroke-width="8"/>
            <polyline points="0,96 12,84 25,96 38,84 50,96 62,84 75,96 88,84 100,96" fill="none" stroke="#3f8f86" stroke-width="8"/>
            <circle cx="50" cy="34" r="5" fill="#d9534f"/><circle cx="34" cy="46" r="4" fill="#3f8f86"/><circle cx="66" cy="46" r="4" fill="#3f8f86"/>
          </g>
          <path d="M50 6 C78 6 94 56 94 84 C94 112 74 126 50 126 C26 126 6 112 6 84 C6 56 22 6 50 6 Z" fill="none" stroke="#2b1a10" stroke-width="5" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="label">ΠΑΣΧΑ</div>
    </div>

    <div class="soon-text">ΕΡΧΟΝΤΑΙ<br>ΣΥΝΤΟΜΑ</div>
  </div>

</main>

<script>
/* ---------- Χρώματα στα γράμματα των Χριστουγέννων ---------- */
// Τα γράμματα παίρνουν με τη σειρά: κόκκινο, πράσινο, άσπρο, και ξανά από την αρχή
(function () {
  var colors = ['#ff5a5a', '#1fa51f', '#ffffff'];
  var box = document.querySelector('.rainbow');
  var n = 0;
  var parts = box.innerHTML.split('<br>');
  box.innerHTML = parts.map(function (line) {
    return line.split('').map(function (ch) {
      return '<span style="color:' + colors[n++ % 3] + '">' + ch + '</span>';
    }).join('');
  }).join('<br>');
})();

/* ---------- Άκρες σαν σχισμένο χαρτί ---------- */
// Μικρή γεννήτρια τυχαίων αριθμών, ώστε οι άκρες να είναι ίδιες κάθε φορά που ζωγραφίζονται
function makeRandom(seed) {
  return function () {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  };
}

// Γυρνάμε γύρω από ένα ορθογώνιο και μετακινούμε λίγο κάθε σημείο, ώστε η άκρη να φαίνεται κομμένη στο χέρι
function wobblyPath(w, h, inset, wobble, seed, step) {
  var rnd = makeRandom(seed);
  var pts = [];
  var x, y;
  function off() { return inset + rnd() * wobble; }
  var m = inset + wobble;   // κρατάμε μια μικρή απόσταση από τις γωνίες
  for (x = m; x <= w - m; x += step * (0.6 + rnd() * 0.8)) pts.push([x, off()]);
  for (y = m; y <= h - m; y += step * (0.6 + rnd() * 0.8)) pts.push([w - off(), y]);
  for (x = w - m; x >= m; x -= step * (0.6 + rnd() * 0.8)) pts.push([x, h - off()]);
  for (y = h - m; y >= m; y -= step * (0.6 + rnd() * 0.8)) pts.push([off(), y]);
  return 'M' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' L') + ' Z';
}

// Ζωγραφίζει κάθε κάρτα: πρώτα το χοντρό περίγραμμα, και από μέσα το χρώμα με διαβάθμιση
function drawCards() {
  var cards = document.querySelectorAll('.card');
  cards.forEach(function (card, i) {
    var svg = card.querySelector('svg.shape');
    var w = card.clientWidth, h = card.clientHeight;
    var id = 'grad' + i;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.innerHTML =
      '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + card.dataset.top + '"/>' +
      '<stop offset="1" stop-color="' + card.dataset.bottom + '"/>' +
      '</linearGradient></defs>' +
      '<path d="' + wobblyPath(w, h, 1, 7, 5 + i * 13, 22) + '" fill="' + card.dataset.edge + '"/>' +
      '<path d="' + wobblyPath(w, h, 11, 6, 9 + i * 7, 26) + '" fill="url(#' + id + ')"/>';
  });
}
window.addEventListener('resize', drawCards);
drawCards();
// Ξαναζωγραφίζουμε όταν φορτώσει η γραμματοσειρά, γιατί αλλάζει το μέγεθος των καρτών
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawCards);
</script>
</body>
</html>
